# GPT Proxy — Docker Compose (optional, for local testing)

services:
  gpt-proxy:
    build: .
    ports:
      - "8700:8700"
    environment:
      - CHATGPT_ACCESS_TOKEN=${CHATGPT_ACCESS_TOKEN:-}
      - CHATGPT_ACCESS_TOKENS=${CHATGPT_ACCESS_TOKENS:-}
      - CHATGPT_BASE_URL=${CHATGPT_BASE_URL:-https://chatgpt.com}
      - PROXY_URL=${PROXY_URL:-}
      - PORT=${PORT:-8700}
      - TIMEOUT=${TIMEOUT:-600}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - WEB_IMAGE_MODEL=${WEB_IMAGE_MODEL:-auto}
      - WEB_IMAGE_MODEL_FALLBACKS=${WEB_IMAGE_MODEL_FALLBACKS:-gpt-5-1-thinking,gpt-5-1,gpt-5-thinking,gpt-5,gpt-4o}
      - WEB_CHAT_MODEL=${WEB_CHAT_MODEL:-gpt-4o}
      - WEB_MODELS=${WEB_MODELS:-gpt-4o,gpt-4o-mini,gpt-5,gpt-5-1,gpt-5-thinking,gpt-5-1-thinking,auto,dall-e-3}
    volumes:
      - images_data:/app/images
    restart: unless-stopped

volumes:
  images_data:
